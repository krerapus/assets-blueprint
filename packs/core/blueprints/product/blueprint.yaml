name: product
# Tracks pack semver via packs/<name>/pack.yaml — do not hardcode a semver here.
extends: default
description: Product discovery profile — planning harness plus PRD/ADR templates.

includes:
  templates:
    - prd.md
    - adr.md
    - review-checklist.md
  prompts:
    system:
      - agent-system.md

variables:
  forge: null
  default_branch: main
  integration_branch: main
